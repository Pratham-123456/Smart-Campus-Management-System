server.port=8080
spring.application.name=smart-campus

# Oracle Database Configuration (Docker 26ai Free)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=campus_app
spring.datasource.password=${CAMPUS_DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Always revalidate static files (JS/CSS) so browsers never run a stale portal build
spring.web.resources.cache.cachecontrol.no-cache=true
